<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/components/layout/style.css" rel="stylesheet">
    <link href="/src/components/ui/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Project Tanggalan Jawa</title>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-6 sm:py-10">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-slate-300 dark:bg-slate-600 rounded-lg"></div>
                <span class="font-semibold text-slate-700 dark:text-slate-300">By Vyy</span>
            </div>

            <div class="toggleWrapper">
                <input class="input" id="dn" type="checkbox" />
                <label class="toggle" for="dn">
                    <span class="toggle__handler">
                        <span class="crater crater--1"></span>
                        <span class="crater crater--2"></span>
                        <span class="crater crater--3"></span>
                    </span>
                    <span class="star star--1"></span>
                    <span class="star star--2"></span>
                    <span class="star star--3"></span>
                    <span class="star star--4"></span>
                    <span class="star star--5"></span>
                    <span class="star star--6"></span>
                </label>
            </div>
        </div>

        <h1 class="text-2xl sm:text-3xl font-bold text-center text-sky-500">Kalender Weton Jawa</h1>
        <h2 id="bulan-tahun-label" class="text-lg sm:text-xl text-center font-bold text-slate-700 mt-1 mb-6">Juli 2026</h2>

        <!-- Day Headers -->
        <div class="grid grid-cols-7 gap-1 sm:gap-2 font-bold text-center text-slate-500 dark:text-slate-400 text-[10px] sm:text-sm mb-2">
            <div><span class="sm:hidden">Min</span><span class="hidden sm:inline">Minggu</span></div>
            <div><span class="sm:hidden">Sen</span><span class="hidden sm:inline">Senin</span></div>
            <div><span class="sm:hidden">Sel</span><span class="hidden sm:inline">Selasa</span></div>
            <div><span class="sm:hidden">Rab</span><span class="hidden sm:inline">Rabu</span></div>
            <div><span class="sm:hidden">Kam</span><span class="hidden sm:inline">Kamis</span></div>
            <div><span class="sm:hidden">Jum</span><span class="hidden sm:inline">Jumat</span></div>
            <div><span class="sm:hidden">Sab</span><span class="hidden sm:inline">Sabtu</span></div>
        </div> 

        <!-- Calendar Grid -->
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 sm:gap-2"></div>

        <div class="flex justify-between items-center mt-4">
            <button id="prev-month" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">‹ Prev</button>
            <button id="next-month" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">Next ›</button>
        </div>

        <!-- Input Section -->
        <div class="mt-10 pt-8 border-t border-slate-200">
            <h2 class="text-xl sm:text-2xl font-bold mb-6 text-center text-slate-800">Cek Hari Baik/Buruk</h2>

            <div id="form-input-section" class="max-w-md mx-auto space-y-4">
                <div>
                    <label for="mode-input" class="block mb-1.5 text-sm font-semibold text-slate-700">Pilih Metode Input</label>
                    <select id="mode-input" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-400">
                        <option value="">-- Pilih --</option>
                        <option value="hari-pasaran">Saya tau Hari & Pasaran</option>
                        <option value="tanggal-lahir">Saya tau Tanggal Lahir</option>
                    </select>
                </div>

                <!-- Section Mode A: Hari + Pasaran -->
                <div id="section-hari-pasaran" class="hidden space-y-4">
                    <div>
                        <label class="block mb-1.5 text-sm font-semibold text-slate-700">Pilih Hari</label>
                        <select id="input-hari" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-400">
                            <option value="senin">Senin</option>
                            <option value="selasa">Selasa</option>
                            <option value="rabu">Rabu</option>
                            <option value="kamis">Kamis</option>
                            <option value="jumat">Jumat</option>
                            <option value="sabtu">Sabtu</option>
                            <option value="minggu">Minggu</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-1.5 text-sm font-semibold text-slate-700">Pilih Pasaran</label>
                        <select id="input-pasaran" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-400">
                            <option value="legi">Legi</option>
                            <option value="pahing">Pahing</option>
                            <option value="pon">Pon</option>
                            <option value="wage">Wage</option>
                            <option value="kliwon">Kliwon</option>
                        </select>
                    </div>
                </div>

                <!-- Section Mode B: Tanggal Lahir -->
                <div id="section-tanggal-lahir" class="hidden">
                    <label class="block mb-1.5 text-sm font-semibold text-slate-700">Tanggal Lahir</label>
                    <input type="date" id="input-tanggal-lahir" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-400">
                </div>

                <div>
                    <label class="block mb-1.5 text-sm font-semibold text-slate-700">Bulan & Tahun yang mau dicek</label>
                    <input type="month" id="input-bulan-target" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-sky-400">
                </div>

                <button id="btn-hitung" class="w-full px-4 py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-semibold rounded-lg transition-colors">
                    Hitung Hari Baik/Buruk
                </button>
            </div>

            <div id="hasil-info" class="mt-4 text-center font-semibold text-slate-700"></div>
        </div>

        <div id="legend-section" class="mt-8 hidden max-w-2xl mx-auto">
            <h3 class="text-base font-bold mb-3 text-slate-800">Keterangan Warna</h3>
            <div id="legend-container" class="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3"></div>
        </div>

        <div class="text-center">
            <button id="btn-ubah-weton" class="mt-6 px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors hidden">
                Ubah Weton
            </button>
        </div>

    </div>

    <script src="/src/services/script.js"></script>
    <script src="/src/api/script.js"></script>
</body>
</html>
