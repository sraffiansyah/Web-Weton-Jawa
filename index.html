<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/components/layout/style.css" rel="stylesheet">
    <link href="/src/components/ui/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Project Tanggalan Jawa</title>
</head>
<body>
    
    <h1 class="text-3xl font-bold text-center text-sky-400">Kalender Weton Jawa</h1>
    
    <!-- Day Headers -->
    <div class="grid grid-cols-7 gap-2 p-4 font-bold text-center text-sm sm: text-base md:text-lg lg:text-xl ">
        <div>Minggu</div>
        <div>Senin</div>
        <div>Selasa</div>
        <div>Rabu</div>
        <div>Kamis</div>
        <div>Jumat</div>
        <div>Sabtu</div>
    </div>

    <!-- Calendar Grid -->
    <div id="calendar-grid" class="grid grid-cols-7 gap-2 p-4"></div>

    <div class="flex justify-between items-center p-4">
        <button id="prev-month" class="px-4 py-2 border rounded">Prev</button>
        <h2 id="bulan-tahun-label" class="text-xl font-bold">Juli 2026</h2>
        <button id="next-month" class="px-4 py-2 border rounded">Next</button>
    </div>
    
    <script src="/src/services/script.js"></script>
    <script src="/src/api/script.js"></script>
</body>
</html>
